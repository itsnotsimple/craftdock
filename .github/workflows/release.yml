name: Build & Release CraftDock

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build and Package CraftDock (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npm run build
          npx electron-builder --win -p never

      - name: Build and Package CraftDock (macOS Apple Silicon & Intel)
        if: matrix.os == 'macos-latest'
        run: |
          npm run build
          npx electron-builder --mac --arm64 -p never
          npx electron-builder --mac --x64 -p never

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            dist_release/*.exe
            dist_release/*.dmg
          body: |
            ## 🎮 CraftDock ${{ github.ref_name }} — Multi-Platform Release

            ### 📥 Downloads (3 Clean Installers)
            * 🪟 **Windows**: `CraftDock-*-Windows-Setup.exe`
            * 🍏 **macOS (Apple Silicon M1/M2/M3/M4)**: `CraftDock-*-macOS-arm64.dmg`
            * 🍏 **macOS (Intel)**: `CraftDock-*-macOS-x64.dmg`

            ---

            ### 🍏 First-Time Launch on macOS (Apple Gatekeeper)
            Because CraftDock is free open-source software without an Apple Developer ID license ($99/year), macOS may display:
            *"CraftDock is damaged and can't be opened. You should move it to the Bin."*

            **To enable normal double-clicking:**
            1. Drag **CraftDock** into your **Applications** folder.
            2. Open **Terminal** and run:
            ```bash
            xattr -cr /Applications/CraftDock.app
            ```
            3. Now double-click CraftDock — it will open immediately!

            *(Alternatively, go to **System Settings ➔ Privacy & Security ➔ Security** and click **Open Anyway**).*

            ---

            ### ✨ What's New in ${{ github.ref_name }}
            * 🚀 **1-Click In-App Auto-Updater**: Directly updates CraftDock with live progress bar and automatic restart.
            * 🍏 **Native macOS Experience**: High-resolution crisp icon and automated Gatekeeper bypass.
            * 🧹 **Complete App & Data Eraser**: Clean uninstallation and total removal of server files, worlds, and runtimes.
            * 🪟 **Clean Window Title**: Alt-Tab and title bar display pure "CraftDock".
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
